<!--
  Brightspace Upcoming Courses Widget — FALL 26 (26/FA)
  Paste into a D2L HTML widget. Requires Manage Files CSV:
  https://YOUR-BRIGHTSPACE-DOMAIN/content/future-courses/26FA-Enrollments-Students.csv
-->
<p></p>
<div id="enrollment-widget-container"></div>
<p><script>
/* Brightspace Enrollment Widget — FALL 26 */

const ENROLL_CODES = new Set(['A', 'N']);
const FALL_26_TERMS = /26\/FA/i;

async function BrightspaceFetch(url) {
  const token = localStorage.getItem('XSRF.Token');
  const res = await fetch(url, {
    headers: { 'X-CSRF-Token': token },
    credentials: 'include'
  });
  if (!res.ok) throw new Error('HTTP error! Status: ' + res.status + ' - ' + url);
  return await res.json();
}

function parseCSV(text) {
  const rows = [];
  let row = [], value = '', insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i], nextChar = text[i + 1];
    if (char === '"' && insideQuotes && nextChar === '"') { value += '"'; i++; }
    else if (char === '"') insideQuotes = !insideQuotes;
    else if (char === ',' && !insideQuotes) { row.push(value.trim()); value = ''; }
    else if ((char === '\n' || char === '\r') && !insideQuotes) {
      if (value || row.length) { row.push(value.trim()); rows.push(row); row = []; value = ''; }
      if (char === '\r' && nextChar === '\n') i++;
    } else value += char;
  }
  if (value || row.length) { row.push(value.trim()); rows.push(row); }

  if (!rows.length) return [];
  const headers = rows.shift().map(h => h.trim().replace(/^\uFEFF/, '').replace(/^"|"$/g, '').toLowerCase());

  return rows.filter(r => r.some(c => String(c || '').trim())).map(r => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = String(r[i] || '').replace(/^"|"$/g, '').trim(); });
    return obj;
  });
}

function orgDefinedIdCandidates(raw) {
  const digits = String(raw ?? '').replace(/\D/g, '');
  if (!digits) return [];
  const trimmed = digits.replace(/^0+/, '') || '0';
  const set = new Set([digits, trimmed]);
  for (const len of [7, 8, 9, 10]) set.add(trimmed.padStart(len, '0'));
  return [...set];
}

function idsMatch(csvId, orgDefinedId) {
  const a = new Set(orgDefinedIdCandidates(csvId));
  const b = new Set(orgDefinedIdCandidates(orgDefinedId));
  for (const id of a) if (b.has(id)) return true;
  return false;
}

function normalizeId(raw) {
  return String(raw ?? '').replace(/\D/g, '').replace(/^0+/, '') || '0';
}

function toDate(dateStr) {
  const dt = new Date(dateStr);
  if (!isNaN(dt.getTime())) return dt;
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(String(dateStr || '').trim());
  if (m) {
    let yy = parseInt(m[3], 10);
    if (m[3].length === 2) yy += yy >= 70 ? 1900 : 2000;
    return new Date(yy, parseInt(m[1], 10) - 1, parseInt(m[2], 10));
  }
  return new Date(0);
}

function isEnrolledStatus(status) {
  return ENROLL_CODES.has(String(status || '').toUpperCase().trim());
}

function isFall26Term(term) {
  return FALL_26_TERMS.test(String(term || '').trim());
}

function latestEnrolledRows(rows, idField) {
  const groups = new Map();
  rows.forEach(row => {
    const id = normalizeId(row[idField]);
    const sec = String(row.sec_name || '').trim();
    const term = String(row.term || '').trim();
    if (!id || !sec || !term) return;
    const key = id + '|' + sec + '|' + term;
    (groups.get(key) || groups.set(key, []).get(key)).push(row);
  });
  const latest = [];
  for (const arr of groups.values()) {
    arr.sort((a, b) => toDate(b.stc_status_date) - toDate(a.stc_status_date));
    if (isEnrolledStatus(arr[0].status)) latest.push(arr[0]);
  }
  latest.sort((a, b) => String(a.sec_title || '').localeCompare(String(b.sec_title || '')));
  return latest;
}

function parseFacultyName(name) {
  if (!name || !String(name).trim()) return 'TBA';
  return String(name).split(/\s*-\s*/).map(instr => {
    const parts = instr.split(',').map(p => p.trim());
    return parts.length >= 2 ? parts[1] + ' ' + parts[0] : instr;
  }).join(', ');
}

function formatDate(dateStr) {
  if (!dateStr) return 'TBA';
  const d = toDate(dateStr);
  return isNaN(d.getTime()) || d.getTime() === 0 ? dateStr : d.toLocaleDateString();
}

function cleanCourseCode(row) {
  return row.sec_name || (row.course_name && row.section ? row.course_name + '-' + row.section : 'Course section unavailable');
}

function renderCourseList(rows, showInstructor) {
  let html = '<ul style="list-style:none; padding-left:0;">';
  rows.forEach(row => {
    html += '<li style="margin-bottom:1em; padding:0.5em; background:#f9f9f9; border-left:4px solid #0077cc;">' +
      '<strong>' + (row.sec_title || 'Untitled Course') + '</strong><br>' +
      'Section: ' + cleanCourseCode(row) + '<br>' +
      'Status Date: ' + formatDate(row.stc_status_date) +
      (showInstructor ? '<br>Instructor: ' + parseFacultyName(row.faculty_name) : '') +
      '</li>';
  });
  return html + '</ul>';
}

(function () {
  const container = document.getElementById('enrollment-widget-container');
  (async () => {
    try {
      const whoami = await BrightspaceFetch('/d2l/api/lp/1.51/users/whoami');
      const blockedUsers = ['admin.username', 'another.user']; // Optional: hide widget for test accounts
      if (blockedUsers.includes(whoami.UniqueName)) return;

      let orgDefinedId = null;
      try {
        const user = await BrightspaceFetch('/d2l/api/lp/1.49/users/' + whoami.Identifier);
        orgDefinedId = String(user.OrgDefinedId || '').trim();
      } catch (err) { console.warn('Could not load OrgDefinedId:', err.message); }

      if (!orgDefinedId) {
        container.innerHTML = '<p style="color:red;">Unable to load your student or faculty ID.</p>';
        return;
      }

      const csvUrl = 'https://YOUR-BRIGHTSPACE-DOMAIN/content/future-courses/26FA-Enrollments-Students.csv';
      const res = await fetch(csvUrl);
      if (!res.ok) throw new Error('CSV fetch failed: ' + res.status);

      const rows = parseCSV(await res.text());
      const termRows = rows.filter(row => isFall26Term(row.term));
      const instructorRows = latestEnrolledRows(termRows.filter(row => idsMatch(row.faculty_id, orgDefinedId)), 'faculty_id');
      const studentRows = latestEnrolledRows(termRows.filter(row => idsMatch(row.person_id, orgDefinedId)), 'person_id');

      if (instructorRows.length > 0) {
        container.innerHTML = '<div style="font-family:Arial,sans-serif;padding:1em;border:1px solid #ccc;border-radius:8px;">' +
          '<h2 style="font-size:1em;margin-bottom:0.5em;">Fall 26 Courses</h2>' +
          '<div id="course-results" style="font-size:0.95em;color:#333;"></div>' +
          '<p style="margin-top:1.5em;">📝 <a href="Textbook requisition" target="_blank" style="color:#0077cc;text-decoration:none;">Submit Faculty Book Orders</a><br><br>' +
          'Please submit your book requests for Fall 2026 by <strong>April 10, 2026</strong>.</p></div>';
        document.getElementById('course-results').innerHTML = renderCourseList(instructorRows, false);
        return;
      }

      container.innerHTML = '<div style="font-family:Arial,sans-serif;padding:1em;border:1px solid #ccc;border-radius:8px;">' +
        '<h2 style="font-size:1em;margin-bottom:0.5em;">Fall 26 Enrollments</h2>' +
        '<div id="course-results" style="font-size:0.95em;color:#333;"></div>' +
        '<p style="margin-top:1.5em;">📚 <a href="https://bookstore.yourcollege.edu/buy_textbooks.asp" target="_blank" style="color:#0077cc;text-decoration:none;">Buy Books</a><br>Starting August 2026</p></div>';

      const output = document.getElementById('course-results');
      output.innerHTML = studentRows.length === 0
        ? '<p>No Fall 2026 courses found.</p>'
        : renderCourseList(studentRows, true);

    } catch (error) {
      container.innerHTML = '<p style="color:red;">Widget Error: ' + error.message + '</p>';
      console.error('Widget error:', error);
    }
  })();
})();
</script></p>
